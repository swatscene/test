name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Fetch Gradle wrapper
        run: |
          curl -L https://codeload.github.com/FabricMC/fabric-example-mod/zip/refs/heads/1.21.11 -o template.zip
          unzip -q template.zip
          cp fabric-example-mod-1.21.11/gradlew .
          cp fabric-example-mod-1.21.11/gradlew.bat .
          mkdir -p gradle/wrapper
          cp -r fabric-example-mod-1.21.11/gradle/wrapper/* gradle/wrapper/
          chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: crystalmacro-jar
          path: build/libs/crystalmacro-*.jar
